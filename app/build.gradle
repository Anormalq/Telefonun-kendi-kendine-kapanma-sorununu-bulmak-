plugins {
    id 'com.android.application'
}

android {
    namespace 'com.anormalq.kapanmadedektifi'
    compileSdk 35

    defaultConfig {
        applicationId 'com.anormalq.kapanmadedektifi'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        // Sabit anahtar: her yeni sürüm eskisinin üzerine kurulabilsin, kayıtlar silinmesin.
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug { signingConfig signingConfigs.debug }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint { abortOnError false; checkReleaseBuilds false }
}

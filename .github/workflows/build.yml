name: APK oluştur

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: APK derle
        run: gradle :app:assembleDebug --stacktrace

      - name: APK'yı yeniden adlandır
        run: cp app/build/outputs/apk/debug/app-debug.apk KapanmaDedektifi.apk

      - uses: actions/upload-artifact@v4
        with:
          name: KapanmaDedektifi
          path: KapanmaDedektifi.apk

      - name: Sürüm (Release) yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Kapanma Dedektifi v1.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: KapanmaDedektifi.apk
          body: |
            Telefona indirip kurun: KapanmaDedektifi.apk
            (Bilinmeyen kaynaklardan yüklemeye izin vermeniz gerekebilir.)
